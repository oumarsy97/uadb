version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql-db
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: "dbuadb"
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    networks:
      - gateway-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root"]
      timeout: 20s
      retries: 10
      interval: 10s
      start_period: 40s

  nestjs-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: microservice-uadb:0.0.1
    container_name: microservice-uadb
    ports:
      - "4000:4000"
    volumes:
      - ./src:/app/src
      - /app/node_modules
    env_file:
      - .env
    environment:
      DATABASE_URL: "mysql://root@mysql-db:3306/dbuadb"
      FRONTEND_URL: "http://localhost:3000"
      # ... vos autres variables
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - gateway-network  # ⭐ Utilise le réseau externe
    command: >
      sh -c "
        echo '🔄 Attente de la base de données...' &&
        sleep 15 &&
        echo '🔧 Génération du client Prisma...' &&
        npx prisma generate &&
        echo '📊 Application du schéma...' &&
        npx prisma db push --accept-data-loss &&
        echo '🚀 Démarrage de l application...' &&
        npm run start:uadb
      "

volumes:
  mysql_data:

networks:
  gateway-network:
    external: true  # ⭐ Utilise le réseau créé manuellement

